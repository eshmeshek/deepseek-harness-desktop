[package]
name = "dsh-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Desktop launcher, background service and updater for DeepSeek Harness"
license = "MIT"

[lib]
name = "dshd"
path = "src/lib.rs"

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: `include_image!` embeds the tray icon at compile time, so the tray
# does not depend on files surviving next to the executable.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
anyhow = "1"

# Unix only: SIGTERM is how a session manager, a logout, or pkill asks a program
# to quit. Tauri does not translate it into its own exit event, so without this
# the backend is left orphaned by an ordinary logout.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
